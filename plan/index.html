<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>План производства</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6feb">
<link rel="apple-touch-icon" href="../icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../config.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#1f6feb;--ok:#1a7f37;--bd:#d9dde3;--rd:#d1242f}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1e2328;--tx:#e8ebee;--mu:#9aa3ad;--ac:#4c9aff;--ok:#3fb950;--bd:#333a42;--rd:#f85149}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
textarea{min-height:70px}
button{font:inherit;border:0;border-radius:8px;padding:9px 13px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.r{background:var(--rd)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input,.row>select{flex:1;min-width:110px;width:auto}
.mu{color:var(--mu);font-size:13px}
.hd{cursor:pointer}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);white-space:nowrap}
.tag.ext{color:#b45309;border-color:#b45309}.tag.own{color:var(--ac);border-color:var(--ac)}
.bar{height:8px;background:var(--bg);border-radius:6px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.stg{margin-top:4px;font-weight:600}
.late{color:var(--rd);font-weight:700}
.dn{opacity:.65}
.gh{margin:16px 2px 8px;font-weight:700}
.st{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
.st input{width:22px;height:22px;flex:none}
.rp{padding:6px 0;border-top:1px solid var(--bd);font-size:13px}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:flex-start;justify-content:center;z-index:10;padding:12px;overflow-y:auto}
.ov .box{background:var(--card);border-radius:14px;padding:14px;max-width:460px;width:100%;margin:auto}
.ov label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mu)}
#zm img{max-width:100%;max-height:92vh;margin:auto}
#lg{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
</style></head><body>
<div id="lg"><div class="card" style="max-width:340px;width:100%;margin:0">
  <b style="font-size:20px">📋 План производства</b>
  <input id="lu" placeholder="Логин" autocapitalize="none" autocomplete="username" style="margin-top:12px">
  <input id="lp" type="password" placeholder="Пароль" autocomplete="current-password" style="margin-top:8px">
  <button id="lb" style="width:100%;margin-top:10px">Войти</button>
  <div id="le" class="mu" style="margin-top:8px;color:var(--rd)"></div></div></div>

<main id="app" style="display:none">
  <div class="row" style="justify-content:space-between;margin-bottom:10px">
    <div><h1>📋 План</h1><div id="who" class="mu"></div></div>
    <div class="row"><a href="../" class="mu" style="padding:8px">📦 Остатки</a><button class="g" id="bout">Выйти</button></div>
  </div>
  <div class="row" style="margin-bottom:10px">
    <button id="badd" style="display:none">＋ Позиция</button><button id="bteam" class="g" style="display:none">👥 Команда</button><button id="bcopy" class="g">📋 Сводка</button>
  </div>
  <input id="q" placeholder="🔍 Поиск по названию, материалу, клиенту" style="margin-bottom:8px">
  <div class="row" style="margin-bottom:6px">
    <select id="ft"><option value="">Все заказы</option><option value="own">Для магазина</option><option value="ext">Сторонние</option></select>
    <select id="fs"><option value="act">В работе</option><option value="done">Готовые</option><option value="all">Все</option></select>
    <select id="fg"></select>
  </div>
  <label id="fmw" class="mu" style="display:none;margin-bottom:8px"><input id="fm" type="checkbox" style="width:auto"> Только мои задачи</label>
  <div id="cnt" class="mu" style="margin:6px 2px"></div>
  <div id="list"></div>
</main>

<div id="edm" class="ov"><div class="box">
  <b id="edt" style="font-size:18px">Позиция плана</b>
  <label>Название детали / изделия *</label><input id="et">
  <div class="row"><div style="flex:1"><label>Тип</label><select id="ety"><option value="own">Для магазина</option><option value="ext">Сторонний заказ</option></select></div>
  <div style="flex:1"><label>Количество, шт *</label><input id="eq" type="number" min="1" inputmode="numeric"></div></div>
  <div id="ecw"><label>Клиент</label><input id="ec"></div>
  <label>Материал</label><input id="em">
  <div class="row"><div style="flex:1"><label>Срочность</label><select id="eu"><option value="urgent">🔥 Срочно</option><option value="normal" selected>Обычная</option><option value="low">Не срочно</option></select></div>
  <div style="flex:1"><label>Срок</label><input id="ed" type="date"></div></div>
  <label>ТЗ / комментарий</label><textarea id="en"></textarea>
  <label>Чертёж (фото, скриншот или PDF)</label><input id="ef" type="file" accept="image/*,application/pdf,.pdf">
  <label>Этапы, нужные для этой позиции</label><div id="est"></div>
  <div class="row" style="margin-top:12px"><button id="esv">Сохранить</button><button id="ecn" class="g">Отмена</button><span id="ems" class="mu"></span></div>
</div></div>

<div id="tm" class="ov"><div class="box">
  <b style="font-size:18px">👥 Команда</b>
  <div id="tl" style="margin:8px 0"></div>
  <b>Добавить сотрудника</b>
  <label>Имя (как будет в отчётах)</label><input id="tn">
  <label>Логин (латиницей, без пробелов)</label><input id="tg" autocapitalize="none">
  <label>Пароль (минимум 6 символов)</label><input id="tpw">
  <label>Роль</label><select id="tr"><option value="operator">Оператор станка</option><option value="fitter">Слесарь</option><option value="admin">Администратор</option></select>
  <div class="row" style="margin-top:12px"><button id="tadd">Добавить</button><button id="tcl" class="g">Закрыть</button></div>
  <div id="tms" class="mu" style="margin-top:8px"></div>
</div></div>

<div id="zm" class="ov" style="align-items:center"><div class="box" style="background:none;padding:0"><button id="zx" style="position:fixed;top:12px;right:12px;width:44px;height:44px;border-radius:50%;padding:0">✕</button><img alt=""></div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PDFV='3.11.174',CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFV+'/';
const isPdf=f=>(f.type||'')==='application/pdf'||(f.name||'').toLowerCase().endsWith('.pdf');
function loadScript(u){return new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>no(new Error('Не удалось загрузить модуль для PDF'));document.head.appendChild(e)})}
async function pdfjs(){if(!window.pdfjsLib){await loadScript(CDN+'pdf.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc=CDN+'pdf.worker.min.js'}return window.pdfjsLib}
async function pdfToCanvas(file){
  const lib=await pdfjs(),doc=await lib.getDocument({data:await file.arrayBuffer()}).promise,pg=await doc.getPage(1);
  const v0=pg.getViewport({scale:1}),k=Math.min(4,1800/Math.max(v0.width,v0.height)),v=pg.getViewport({scale:k});
  const c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext:x,viewport:v}).promise;return c}
function imgToCanvas(file){return new Promise((ok,no)=>{
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const k=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);ok(c)};
  im.onerror=()=>no(new Error(/hei[cf]/i.test((file.type||'')+file.name)?'Формат HEIC не поддерживается. Сделайте скриншот фото или переснимите в JPG':'Не удалось открыть файл как изображение'));
  im.src=u})}
const fileToCanvas=f=>isPdf(f)?pdfToCanvas(f):imgToCanvas(f);
function shrink(c0){const k=Math.min(1,900/Math.max(c0.width,c0.height)),c=document.createElement('canvas');
  c.width=Math.round(c0.width*k);c.height=Math.round(c0.height*k);c.getContext('2d').drawImage(c0,0,0,c.width,c.height);
  let q=.65,d=c.toDataURL('image/jpeg',q);while(d.length>180000&&q>.2){q-=.1;d=c.toDataURL('image/jpeg',q)}return d}


const STEPS=[
 {k:'draw',n:'Чертежи / согласование',who:['admin']},
 {k:'inv',n:'Счёт клиенту',who:['admin']},
 {k:'pay',n:'Оплата получена',who:['admin']},
 {k:'mat',n:'Заказ материала / заготовок',who:['admin']},
 {k:'blank',n:'Заготовка материала',who:['admin','operator']},
 {k:'mach',n:'Изготовление на станках',who:['admin','operator']},
 {k:'hand',n:'Сдача на слесарный участок',who:['admin','operator']},
 {k:'fit',n:'Слесарная доработка',who:['admin','fitter']},
 {k:'coat',n:'Покрытие',who:['admin','fitter']},
 {k:'done',n:'Сдано на склад / клиенту',who:['admin','fitter']}];
const ROLES={admin:'Администратор',operator:'Оператор станка',fitter:'Слесарь'};
const STN=['ЧПУ токарный','ЧПУ фрезерный','Универс. токарный','Универс. фрезерный'];
const URG=[['urgent','🔥 Срочно'],['normal','Обычные'],['low','Не срочно']];
const MINE={operator:['draw','mat','blank','mach','hand'],fitter:['fit','coat','done']};
const defOn=(ty,k)=>!(k==='fit'||k==='coat'||(ty==='own'&&(k==='inv'||k==='pay')));
let me=null,items=[],team=[],started=false,editing=null,dirty=false;const open=new Set();
const cur=it=>STEPS.find(s=>it.steps&&it.steps[s.k]&&it.steps[s.k].on&&!it.steps[s.k].done);
const sum=(it,f)=>(it.reports||[]).filter(f).reduce((n,r)=>n+(+r.q||0),0);
const dd=d=>d?d.slice(8,10)+'.'+d.slice(5,7):'';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const flash=e=>{e.style.borderColor='#d1242f';setTimeout(()=>e.style.borderColor='',1500)};
const when=t=>new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const col=n=>firebase.firestore().collection(n);

firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth();
try{firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(_){}
const go=()=>{$('le').textContent='';const l=$('lu').value.trim().toLowerCase();
  auth.signInWithEmailAndPassword(l+'@plan.local',$('lp').value).catch(e=>{$('le').textContent=e.code==='auth/network-request-failed'?'Нет интернета':'Неверный логин или пароль'})};
$('lb').onclick=go;$('lp').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
$('bout').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
  if(!u){me=null;$('lg').style.display='flex';$('app').style.display='none';return}
  try{
    const d=await col('users').doc(u.uid).get();
    if(!d.exists){$('le').textContent='Нет доступа. Попросите администратора добавить вас.';await auth.signOut();return}
    me={uid:u.uid,...d.data()};start();
  }catch(e){$('le').textContent='Ошибка: '+(e.message||e.code)}
});
function start(){
  $('lg').style.display='none';$('app').style.display='block';
  $('who').textContent=me.name+' · '+(ROLES[me.role]||me.role);
  const adm=me.role==='admin';
  $('badd').style.display=adm?'':'none';$('bteam').style.display=adm?'':'none';
  $('fmw').style.display=adm?'none':'block';$('fm').checked=!adm;
  if(started)return;started=true;
  $('fg').innerHTML='<option value="">Все этапы</option>'+STEPS.map(s=>`<option value="${s.k}">${s.n}</option>`).join('');
  col('plan').onSnapshot(sn=>{items=sn.docs.map(d=>({id:d.id,...d.data()}));soft()},e=>{$('cnt').textContent='Ошибка плана: '+(e.message||e.code)});
  if(adm)col('users').onSnapshot(sn=>{team=sn.docs.map(d=>({id:d.id,...d.data()}));renderTeam()});
}
function soft(){const a=document.activeElement;if(a&&$('list').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){dirty=true;return}render()}
$('list').addEventListener('focusout',()=>{if(dirty)setTimeout(()=>{if(!$('list').contains(document.activeElement)){dirty=false;render()}},50)});

function visible(){
  const q=$('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean),ty=$('ft').value,st=$('fs').value,sg=$('fg').value,mine=$('fm').checked&&me&&me.role!=='admin';
  return items.filter(it=>{
    const c=cur(it),dn=!c;
    if(ty&&it.type!==ty)return false;
    if(st==='act'&&dn)return false;if(st==='done'&&!dn)return false;
    if(sg&&(!c||c.k!==sg))return false;
    if(mine&&(!c||!(MINE[me.role]||[]).includes(c.k)))return false;
    const t=(it.title+' '+(it.material||'')+' '+(it.client||'')).toLowerCase();
    return q.every(w=>t.includes(w));
  });
}
function card(it){
  const c=cur(it),dn=!c,x=open.has(it.id),adm=me.role==='admin';
  const made=sum(it,r=>r.r!=='fitter'),fin=sum(it,r=>r.r==='fitter'),brak=(it.reports||[]).reduce((n,r)=>n+(+r.b||0),0);
  const pct=Math.min(100,Math.round(made/(it.qty||1)*100)),late=it.due&&it.due<today()&&!dn;
  let h=`<div class="card${dn?' dn':''}" data-id="${it.id}"><div class="hd" data-a="tog">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${esc(it.title)}</b><span class="tag ${it.type}">${it.type==='ext'?'Сторонний':'Магазин'}</span></div>
    <div class="mu">${it.type==='ext'&&it.client?esc(it.client)+' · ':''}${esc(it.material||'')}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="row mu" style="justify-content:space-between"><span>Изготовлено ${made} из ${it.qty} шт${brak?' · брак '+brak:''}</span><span${late?' class="late"':''}>${it.due?'до '+dd(it.due):''}</span></div>
    <div class="stg">${dn?'✅ Готово':'Этап: '+c.n}</div></div>`;
  if(x){
    if(it.img)h+=`<img src="${it.img}" data-a="zoom" alt="" style="width:100%;max-height:260px;object-fit:contain;margin-top:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);cursor:zoom-in">`;
    if(it.notes)h+=`<div style="margin-top:10px;white-space:pre-wrap"><span class="mu">ТЗ:</span> ${esc(it.notes)}</div>`;
    h+='<div style="margin-top:10px">'+STEPS.filter(s=>it.steps&&it.steps[s.k]&&it.steps[s.k].on).map(s=>{
      const v=it.steps[s.k],can=s.who.includes(me.role);
      return `<label class="st"><input type="checkbox" data-st="${s.k}" ${v.done?'checked':''} ${can?'':'disabled'}><span style="flex:1">${s.n}</span><span class="mu">${v.done&&v.by?esc(v.by)+' '+when(v.t):''}</span></label>`}).join('')+'</div>';
    if(it.steps&&it.steps.fit&&it.steps.fit.on)h+=`<div class="mu" style="margin-top:6px">Слесарка: готово ${fin} из ${it.qty} шт</div>`;
    h+='<div style="margin-top:10px"><b>Отчёт</b><div class="row" style="margin-top:6px"><input class="rq" type="number" min="0" inputmode="numeric" placeholder="Годных, шт"><input class="rb" type="number" min="0" inputmode="numeric" placeholder="Брак, шт"></div>';
    if(me.role!=='fitter')h+='<select class="rs" style="margin-top:6px">'+STN.map(s=>`<option>${s}</option>`).join('')+'</select>';
    h+='<input class="rn" placeholder="Комментарий (установ, замечание)" style="margin-top:6px"><button data-a="rep" style="margin-top:8px">Отправить отчёт</button></div>';
    const rp=(it.reports||[]).slice().reverse().slice(0,12);
    if(rp.length)h+='<div style="margin-top:10px">'+rp.map(r=>`<div class="rp"><span class="mu">${when(r.t)} · ${esc(r.by)}${r.s?' · '+esc(r.s):''}</span><br>Годных: <b>${r.q||0}</b>${r.b?', брак: <b>'+r.b+'</b>':''}${r.n?' · '+esc(r.n):''}</div>`).join('')+'</div>';
    if(adm)h+='<div class="row" style="margin-top:10px"><button class="g" data-a="edit">✏️ Изменить</button><button class="g" data-a="del" style="color:var(--rd)">🗑 Удалить</button></div>';
  }
  return h+'</div>';
}
function render(){
  const v=visible();$('cnt').textContent=v.length+' из '+items.length+' позиций';
  const by=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(a.cr||0)-(b.cr||0);
  $('list').innerHTML=v.length?URG.map(([k,n])=>{const g=v.filter(i=>(i.urg||'normal')===k).sort(by);return g.length?`<div class="gh">${n} (${g.length})</div>`+g.map(card).join(''):''}).join(''):'<div class="mu" style="text-align:center;padding:24px">Нет позиций</div>';
}
['q','ft','fs','fg','fm'].forEach(i=>$(i).addEventListener(i==='q'?'input':'change',render));

$('list').addEventListener('click',async e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const c=e.target.closest('.card'),id=c.dataset.id,it=items.find(i=>i.id===id),a=t.dataset.a;
  try{
    if(a==='tog'){open.has(id)?open.delete(id):open.add(id);render();return}
    if(a==='zoom'){$('zm').querySelector('img').src=it.img;$('zm').style.display='flex';return}
    if(a==='edit'){openEd(it);return}
    if(a==='del'){if(confirm('Удалить позицию «'+it.title+'»?'))await col('plan').doc(id).delete();return}
    if(a==='rep'){
      const q=parseInt(c.querySelector('.rq').value,10)||0,b=parseInt(c.querySelector('.rb').value,10)||0;
      if(!q&&!b){flash(c.querySelector('.rq'));return}
      const s=c.querySelector('.rs');
      await col('plan').doc(id).update({reports:firebase.firestore.FieldValue.arrayUnion({t:Date.now(),by:me.name,r:me.role,q,b,s:s?s.value:'',n:c.querySelector('.rn').value.trim()}),upd:Date.now()});
      dirty=false;
    }
  }catch(err){alert('Не удалось сохранить: '+(err.message||err.code))}
});
$('list').addEventListener('change',async e=>{
  const k=e.target.dataset.st;if(!k)return;const id=e.target.closest('.card').dataset.id;
  try{await col('plan').doc(id).update({['steps.'+k+'.done']:e.target.checked,['steps.'+k+'.t']:Date.now(),['steps.'+k+'.by']:me.name,upd:Date.now()})}
  catch(err){e.target.checked=!e.target.checked;alert('Нет прав или нет связи: '+(err.message||err.code))}
});
$('zx').onclick=()=>{$('zm').style.display='none'};$('zm').onclick=e=>{if(e.target.id==='zm')$('zm').style.display='none'};

/* редактор позиции */
function stepBoxes(on){$('est').innerHTML=STEPS.map(s=>`<label style="display:flex;gap:8px;align-items:center;margin:4px 0;color:var(--tx);font-size:15px"><input type="checkbox" id="es_${s.k}" style="width:20px;height:20px" ${on[s.k]?'checked':''}> ${s.n}</label>`).join('')}
function openEd(it){
  editing=it||null;$('edt').textContent=it?'Изменить позицию':'Новая позиция';$('ems').textContent='';
  $('et').value=it?it.title:'';$('ety').value=it?it.type:'own';$('eq').value=it?it.qty:'';$('ec').value=it?it.client||'':'';
  $('em').value=it?it.material||'':'';$('eu').value=it?it.urg||'normal':'normal';$('ed').value=it?it.due||'':'';$('en').value=it?it.notes||'':'';$('ef').value='';
  const on={};STEPS.forEach(s=>on[s.k]=it?!!(it.steps&&it.steps[s.k]&&it.steps[s.k].on):defOn('own',s.k));
  stepBoxes(on);$('ecw').style.display=$('ety').value==='ext'?'':'none';
  $('edm').style.display='flex';
}
$('badd').onclick=()=>openEd(null);
$('ety').onchange=()=>{$('ecw').style.display=$('ety').value==='ext'?'':'none';if(!editing){const on={};STEPS.forEach(s=>on[s.k]=defOn($('ety').value,s.k));stepBoxes(on)}};
$('ecn').onclick=()=>{$('edm').style.display='none'};
$('esv').onclick=async()=>{
  const title=$('et').value.trim(),qty=parseInt($('eq').value,10);
  if(!title||!qty||qty<1){if(!title)flash($('et'));if(!qty||qty<1)flash($('eq'));return}
  $('esv').disabled=true;$('ems').textContent='Сохраняю…';
  try{
    const old=editing&&editing.steps||{},steps={};
    STEPS.forEach(s=>{const on=$('es_'+s.k).checked,o=old[s.k]||{};steps[s.k]={on,done:on&&!!o.done,t:o.t||0,by:o.by||''}});
    const d={title,type:$('ety').value,client:$('ec').value.trim(),qty,material:$('em').value.trim(),urg:$('eu').value,due:$('ed').value,notes:$('en').value.trim(),steps,upd:Date.now()};
    const f=$('ef').files[0];if(f)d.img=shrink(await fileToCanvas(f));
    if(editing)await col('plan').doc(editing.id).update(d);
    else{d.cr=Date.now();d.reports=[];d.img=d.img||'';await col('plan').doc(d.cr.toString(36)+Math.random().toString(36).slice(2,6)).set(d)}
    $('edm').style.display='none';
  }catch(err){$('ems').textContent='Ошибка: '+(err.message||err.code)}
  finally{$('esv').disabled=false}
};

/* команда */
function renderTeam(){
  $('tl').innerHTML=team.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ru')).map(u=>`<div class="rp" style="display:flex;align-items:center;gap:8px"><div style="flex:1"><b>${esc(u.name)}</b><br><span class="mu">логин: ${esc(u.login||'')} · ${ROLES[u.role]||u.role}</span></div>${u.id===me.uid?'':`<button class="g" data-u="${u.id}" style="color:var(--rd)">Убрать</button>`}</div>`).join('')}
$('bteam').onclick=()=>{$('tm').style.display='flex'};$('tcl').onclick=()=>{$('tm').style.display='none'};
$('tl').addEventListener('click',async e=>{const id=e.target.dataset.u;if(!id)return;const u=team.find(x=>x.id===id);
  if(confirm('Убрать доступ у «'+u.name+'»?'))try{await col('users').doc(id).delete()}catch(err){alert(err.message)}});
$('tadd').onclick=async()=>{
  const name=$('tn').value.trim(),login=$('tg').value.trim().toLowerCase(),pw=$('tpw').value,role=$('tr').value,ms=$('tms');
  if(!name||!/^[a-z0-9._-]+$/.test(login)||pw.length<6){ms.textContent='Заполните имя, логин латиницей и пароль от 6 символов';return}
  $('tadd').disabled=true;ms.textContent='Создаю…';
  try{
    const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec');
    const r=await sec.auth().createUserWithEmailAndPassword(login+'@plan.local',pw);
    await col('users').doc(r.user.uid).set({name,role,login,cr:Date.now()});
    await sec.auth().signOut();
    ms.textContent='Добавлен: '+name+'. Логин: '+login;$('tn').value=$('tg').value=$('tpw').value='';
  }catch(err){ms.textContent=err.code==='auth/email-already-in-use'?'Такой логин уже занят, придумайте другой':'Ошибка: '+(err.message||err.code)}
  finally{$('tadd').disabled=false}
};

/* сводка для Telegram */
$('bcopy').onclick=()=>{
  const v=items.filter(i=>cur(i)),by=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999');
  let t='План производства на '+dd(today())+'\n';
  URG.forEach(([k,n])=>{const g=v.filter(i=>(i.urg||'normal')===k).sort(by);if(!g.length)return;t+='\n'+n+':\n'+g.map(i=>'• '+i.title+' — '+sum(i,r=>r.r!=='fitter')+'/'+i.qty+' шт'+(i.due?', до '+dd(i.due):'')+', '+cur(i).n+(i.type==='ext'?' (сторонний)':'')).join('\n')+'\n'});
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$('cnt').textContent='Сводка скопирована, вставьте в Telegram'}).catch(()=>prompt('Скопируйте текст:',t));
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script></body></html>
