<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>План производства</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6feb">
<link rel="apple-touch-icon" href="../icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../config.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#1f6feb;--ok:#1a7f37;--bd:#d9dde3;--rd:#d1242f}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1e2328;--tx:#e8ebee;--mu:#9aa3ad;--ac:#4c9aff;--ok:#3fb950;--bd:#333a42;--rd:#f85149}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.in{margin:8px 0 0;border-left:3px solid var(--ac)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
textarea{min-height:70px}
button{font:inherit;border:0;border-radius:8px;padding:9px 13px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bt{justify-content:space-between;flex-wrap:nowrap}
.row>input,.row>select{flex:1;min-width:110px;width:auto}
.mu{color:var(--mu);font-size:13px}
.hd{cursor:pointer}
.top{display:flex;gap:10px}
.th{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);flex:none;cursor:zoom-in;background:var(--bg)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);white-space:nowrap}
.tag.ext{color:#b45309;border-color:#b45309}.tag.own{color:var(--ac);border-color:var(--ac)}
.bar{height:8px;background:var(--bg);border-radius:6px;margin:6px 0 3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.bar.sm{height:6px;margin:3px 0;flex:1}
.sb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.stg{margin-top:4px;font-weight:600;font-size:14px}
.late{color:var(--rd);font-weight:700}
.dn{opacity:.65}
.gh{margin:16px 2px 8px;font-weight:700}
.gt{font-weight:700;margin:12px 0 2px;font-size:13px;color:var(--ac)}
.st{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
.st input{width:22px;height:22px;flex:none}
.rp{padding:6px 0;border-top:1px solid var(--bd);font-size:13px}
.su{border:1px solid var(--bd);border-radius:10px;padding:8px;margin:8px 0}
.priv{border:1px dashed var(--rd);border-radius:10px;padding:8px;margin-top:10px}
a.f{color:var(--ac);cursor:pointer;text-decoration:underline}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:flex-start;justify-content:center;z-index:10;padding:12px;overflow-y:auto}
.ov .box{background:var(--card);border-radius:14px;padding:14px;max-width:460px;width:100%;margin:auto}
.ov label.l{display:block;margin:10px 0 3px;font-size:13px;color:var(--mu)}
#zm img{max-width:100%;max-height:92vh;margin:auto}
#lg{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
</style></head><body>
<div id="lg"><div class="card" style="max-width:340px;width:100%;margin:0">
  <b style="font-size:20px">📋 План производства</b>
  <input id="lu" placeholder="Логин" autocapitalize="none" autocomplete="username" style="margin-top:12px">
  <input id="lp" type="password" placeholder="Пароль" autocomplete="current-password" style="margin-top:8px">
  <button id="lb" style="width:100%;margin-top:10px">Войти</button>
  <div id="le" class="mu" style="margin-top:8px;color:var(--rd)"></div></div></div>

<main id="app" style="display:none">
  <div class="row bt" style="margin-bottom:10px">
    <div><h1>📋 План</h1><div id="who" class="mu"></div></div>
    <div class="row"><a href="../" class="mu" style="padding:8px">📦 Остатки</a><button class="g" id="bout">Выйти</button></div>
  </div>
  <div class="row" style="margin-bottom:10px">
    <button id="badd" style="display:none">＋ Позиция</button><button id="bteam" class="g" style="display:none">👥 Команда</button><button id="bcopy" class="g">📋 Сводка</button>
  </div>
  <input id="q" placeholder="🔍 Название, артикул, материал, клиент, проект" style="margin-bottom:8px">
  <div class="row" style="margin-bottom:6px">
    <select id="fv"><option value="part">Показывать: детали</option><option value="proj">Показывать: проекты</option></select>
    <select id="ft"><option value="">Все заказы</option><option value="own">Для магазина</option><option value="ext">Сторонние</option></select>
  </div>
  <div class="row" style="margin-bottom:6px">
    <select id="fs"><option value="act">В работе</option><option value="done">Готовые</option><option value="all">Все</option></select>
    <select id="fg"></select>
  </div>
  <label id="fmw" class="mu" style="display:none;margin-bottom:8px"><input id="fm" type="checkbox" style="width:auto"> Только мои задачи</label>
  <div id="cnt" class="mu" style="margin:6px 2px"></div>
  <div id="list"></div>
</main>

<div id="edm" class="ov"><div class="box">
  <b id="edt" style="font-size:18px">Позиция плана</b>
  <label class="l">Название детали / изделия *</label><input id="et">
  <div class="row"><div style="flex:1"><label class="l">Артикул</label><input id="ea"></div>
  <div style="flex:1"><label class="l">Количество, шт *</label><input id="eq" type="number" min="1" inputmode="numeric"></div></div>
  <div class="row"><div style="flex:1"><label class="l">Тип</label><select id="ety"><option value="own">Для магазина</option><option value="ext">Сторонний заказ</option></select></div>
  <div style="flex:1"><label class="l">Материал</label><input id="em"></div></div>
  <div id="ecw"><label class="l">Клиент</label><input id="ec"></div>
  <label class="l">Проект (общий для нескольких деталей)</label><select id="epj"></select><input id="epn" placeholder="Название нового проекта" style="display:none;margin-top:6px">
  <div class="row"><div style="flex:1"><label class="l">Срочность</label><select id="eu"><option value="urgent">🔥 Срочно</option><option value="normal" selected>Обычная</option><option value="low">Не срочно</option></select></div>
  <div style="flex:1"><label class="l">Срок</label><input id="ed" type="date"></div></div>
  <label class="l">ТЗ / комментарий</label><textarea id="en"></textarea>
  <label class="l">Чертёж (фото, скриншот или PDF)</label><input id="ef" type="file" accept="image/*,application/pdf,.pdf">
  <label class="l">Файлы для всех: 3D-модели и др. (до 8 МБ каждый)</label><input id="efp" type="file" multiple>
  <div class="priv"><b style="color:var(--rd)">🔒 Только для администратора</b>
    <label class="l">Анкетные данные заказчика, заметки</label><textarea id="einf"></textarea>
    <label class="l">Счета, договоры, документы (до 8 МБ каждый)</label><input id="efv" type="file" multiple></div>
  <label class="l">Этапы, нужные для этой позиции</label><div id="est"></div>
  <div class="row" style="margin-top:12px"><button id="esv">Сохранить</button><button id="ecn" class="g">Отмена</button><span id="ems" class="mu"></span></div>
</div></div>

<div id="tm" class="ov"><div class="box">
  <b style="font-size:18px">👥 Команда</b>
  <div id="tl" style="margin:8px 0"></div>
  <b>Добавить сотрудника</b>
  <label class="l">Имя (как будет в отчётах)</label><input id="tn">
  <label class="l">Логин (латиницей, без пробелов)</label><input id="tg" autocapitalize="none">
  <label class="l">Пароль (минимум 6 символов)</label><input id="tpw">
  <label class="l">Роль</label><select id="tr"><option value="operator">Оператор станка</option><option value="fitter">Слесарь</option><option value="admin">Администратор</option></select>
  <div class="row" style="margin-top:12px"><button id="tadd">Добавить</button><button id="tcl" class="g">Закрыть</button></div>
  <div id="tms" class="mu" style="margin-top:8px"></div>
</div></div>

<div id="zm" class="ov" style="align-items:center"><div class="box" style="background:none;padding:0"><button id="zx" style="position:fixed;top:12px;right:12px;width:44px;height:44px;border-radius:50%;padding:0">✕</button><img alt=""></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PDFV='3.11.174',CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFV+'/';
const isPdf=f=>(f.type||'')==='application/pdf'||(f.name||'').toLowerCase().endsWith('.pdf');
function loadScript(u){return new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>no(new Error('Не удалось загрузить модуль для PDF'));document.head.appendChild(e)})}
async function pdfjs(){if(!window.pdfjsLib){await loadScript(CDN+'pdf.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc=CDN+'pdf.worker.min.js'}return window.pdfjsLib}
async function pdfToCanvas(file){
  const lib=await pdfjs(),doc=await lib.getDocument({data:await file.arrayBuffer()}).promise,pg=await doc.getPage(1);
  const v0=pg.getViewport({scale:1}),k=Math.min(4,1800/Math.max(v0.width,v0.height)),v=pg.getViewport({scale:k});
  const c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext:x,viewport:v}).promise;return c}
function imgToCanvas(file){return new Promise((ok,no)=>{
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const k=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);ok(c)};
  im.onerror=()=>no(new Error(/hei[cf]/i.test((file.type||'')+file.name)?'Формат HEIC не поддерживается. Сделайте скриншот фото или переснимите в JPG':'Не удалось открыть файл как изображение'));
  im.src=u})}
const fileToCanvas=f=>isPdf(f)?pdfToCanvas(f):imgToCanvas(f);
function shrink(c0){const k=Math.min(1,900/Math.max(c0.width,c0.height)),c=document.createElement('canvas');
  c.width=Math.round(c0.width*k);c.height=Math.round(c0.height*k);c.getContext('2d').drawImage(c0,0,0,c.width,c.height);
  let q=.65,d=c.toDataURL('image/jpeg',q);while(d.length>180000&&q>.2){q-=.1;d=c.toDataURL('image/jpeg',q)}return d}


const GR={1:'Подготовка',2:'Производство',3:'Слесарка и отделка'};
const GT={1:'Группа 1 · Подготовка (администратор)',2:'Группа 2 · Производство',3:'Слесарка и отделка'};
const STEPS=[
 {k:'draw',g:1,n:'Чертежи / 3D-модели, согласование',who:['admin']},
 {k:'inv',g:1,n:'Стоимость и счёт (сторонние)',who:['admin']},
 {k:'pay',g:1,n:'Оплата получена (сторонние)',who:['admin']},
 {k:'mat',g:1,n:'Заказ материала / заготовок',who:['admin']},
 {k:'blank',g:2,n:'Заготовка материала',who:['admin','operator']},
 {k:'tp',g:2,n:'Техпроцесс: сетапы определены',who:['admin','operator']},
 {k:'mach',g:2,n:'Изготовление на станках',who:['admin','operator']},
 {k:'hand',g:2,n:'Сдача на слесарный участок',who:['admin','operator']},
 {k:'fit',g:3,n:'Слесарная доработка',who:['admin','fitter']},
 {k:'coat',g:3,n:'Покрытие',who:['admin','fitter']},
 {k:'done',g:3,n:'Сдано на склад / клиенту',who:['admin','fitter']}];
const ROLES={admin:'Администратор',operator:'Оператор станка',fitter:'Слесарь'};
const STN=['ЧПУ токарный','ЧПУ фрезерный','Токарный универсал','Фрезерный универсал'];
const SHORT={'ЧПУ токарный':'ЧПУ-ток','ЧПУ фрезерный':'ЧПУ-фрез','Токарный универсал':'Ток-ун','Фрезерный универсал':'Фрез-ун'};
const URG=[['urgent','🔥 Срочно'],['normal','Обычные'],['low','Не срочно']];
const defOn=(ty,k)=>!(k==='fit'||k==='coat'||(ty==='own'&&(k==='inv'||k==='pay')));
let me=null,items=[],projs=[],team=[],privs={},started=false,editing=null,dirty=false;const open=new Set(),openP=new Set();
const cur=it=>STEPS.find(s=>it.steps&&it.steps[s.k]&&it.steps[s.k].on&&!it.steps[s.k].done);
const sset=it=>Object.entries(it.setups||{}).map(([id,s])=>({id,...s})).sort((a,b)=>(a.n||0)-(b.n||0));
const smade=s=>(s.reports||[]).reduce((n,r)=>n+(+r.q||0),0);
const sbrak=s=>(s.reports||[]).reduce((n,r)=>n+(+r.b||0),0);
const ready=it=>{const a=sset(it);return a.length?Math.min(...a.map(smade)):0};
const prog=it=>cur(it)?ready(it):(+it.qty||0);
const dd=d=>d?d.slice(8,10)+'.'+d.slice(5,7):'';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const flash=e=>{e.style.borderColor='#d1242f';setTimeout(()=>e.style.borderColor='',1500)};
const when=t=>new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' МБ':Math.max(1,Math.round(n/1024))+' КБ';
const col=n=>firebase.firestore().collection(n);
const FV=()=>firebase.firestore.FieldValue;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth();
try{firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(_){}
const go=()=>{$('le').textContent='';const l=$('lu').value.trim().toLowerCase().split('@')[0].replace(/\s/g,'');
  if(!l||!$('lp').value){$('le').textContent='Введите логин и пароль';return}
  $('le').textContent='Вхожу…';
  auth.signInWithEmailAndPassword(l+'@plan.local',$('lp').value).catch(e=>{const M={'auth/network-request-failed':'Нет интернета','auth/too-many-requests':'Слишком много попыток, подождите несколько минут','auth/unauthorized-domain':'Этот адрес не добавлен в авторизованные домены Firebase','auth/operation-not-allowed':'Вход по почте и паролю не включён в Firebase'};
    $('le').textContent=(M[e.code]||'Неверный логин или пароль')+' ['+(e.code||e.message)+']'})};
$('lb').onclick=go;$('lp').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
$('bout').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
  if(!u){me=null;$('lg').style.display='flex';$('app').style.display='none';return}
  try{
    const d=await col('users').doc(u.uid).get();
    if(!d.exists){$('le').textContent='Нет доступа. Попросите администратора добавить вас.';await auth.signOut();return}
    me={uid:u.uid,...d.data()};start();
  }catch(e){$('le').textContent='Ошибка: '+(e.message||e.code)}
});
function start(){
  $('lg').style.display='none';$('app').style.display='block';
  $('who').textContent=me.name+' · '+(ROLES[me.role]||me.role);
  const adm=me.role==='admin';
  $('badd').style.display=adm?'':'none';$('bteam').style.display=adm?'':'none';
  $('fmw').style.display=adm?'none':'block';$('fm').checked=!adm;
  if(started)return;started=true;
  $('fg').innerHTML='<option value="">Все этапы</option>'+[1,2,3].map(g=>`<optgroup label="${GT[g]}">`+STEPS.filter(s=>s.g===g).map(s=>`<option value="${s.k}">${s.n}</option>`).join('')+'</optgroup>').join('');
  col('plan').onSnapshot(sn=>{items=sn.docs.map(d=>({id:d.id,...d.data()}));soft()},e=>{$('cnt').textContent='Ошибка плана: '+(e.message||e.code)});
  col('projects').onSnapshot(sn=>{projs=sn.docs.map(d=>({id:d.id,...d.data()}));soft()});
  if(adm){
    col('users').onSnapshot(sn=>{team=sn.docs.map(d=>({id:d.id,...d.data()}));renderTeam()});
    col('plan_private').onSnapshot(sn=>{privs={};sn.docs.forEach(d=>privs[d.id]=d.data());soft()});
  }
}
function soft(){const a=document.activeElement;if(a&&$('list').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){dirty=true;return}render()}
$('list').addEventListener('focusout',()=>{if(dirty)setTimeout(()=>{if(!$('list').contains(document.activeElement)){dirty=false;render()}},50)});

function visible(){
  const q=$('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean),ty=$('ft').value,st=$('fs').value,sg=$('fg').value,mine=$('fm').checked&&me&&me.role!=='admin';
  return items.filter(it=>{
    const c=cur(it),dn=!c;
    if(ty&&it.type!==ty)return false;
    if(st==='act'&&dn)return false;if(st==='done'&&!dn)return false;
    if(sg&&(!c||c.k!==sg))return false;
    if(mine&&(!c||c.g!==(me.role==='operator'?2:3)))return false;
    const p=projs.find(x=>x.id===it.proj);
    const t=(it.title+' '+(it.art||'')+' '+(it.material||'')+' '+(it.client||'')+' '+(p?p.name:'')).toLowerCase();
    return q.every(w=>t.includes(w));
  });
}
function fileRow(m,kind,adm){return `<div class="rp"><a class="f" data-a="dl" data-k="${kind}" data-fid="${m.fid}">📎 ${esc(m.name)}</a> <span class="mu">${kb(m.size)}</span>${adm?` <a class="f" data-a="fdel" data-k="${kind}" data-fid="${m.fid}" style="color:var(--rd)">удалить</a>`:''}</div>`}
function card(it,inP){
  const c=cur(it),dn=!c,x=open.has(it.id),adm=me.role==='admin',op=me.role==='operator'||adm,ft=me.role==='fitter'||adm;
  const ss=sset(it),rd=prog(it),pc=p=>Math.min(100,Math.round(p/(it.qty||1)*100)),late=it.due&&it.due<today()&&!dn;
  const fin=(it.reports||[]).reduce((n,r)=>n+(+r.q||0),0),pj=projs.find(p=>p.id===it.proj);
  let h=`<div class="card${dn?' dn':''}${inP?' in':''}" data-id="${it.id}"><div class="hd" data-a="tog"><div class="top">
    ${it.img?`<img class="th" src="${it.img}" data-a="zoom" alt="">`:''}
    <div style="flex:1;min-width:0">
      <div class="row bt"><b>${esc(it.title)}</b><span class="tag ${it.type}">${it.type==='ext'?'Сторонний':'Магазин'}</span></div>
      <div class="mu">${it.art?'Арт. '+esc(it.art)+' · ':''}${it.type==='ext'&&it.client?esc(it.client)+' · ':''}${esc(it.material||'')}${pj&&!inP?' · 📁 '+esc(pj.name):''}</div>
      <div class="bar"><i style="width:${pc(rd)}%"></i></div>
      <div class="row mu bt"><span>Готово ${rd} из ${it.qty} шт</span><span${late?' class="late"':''}>${it.due?'до '+dd(it.due):''}</span></div>
      ${ss.map(s=>`<div class="sb"><span style="min-width:78px">№${s.n} ${esc(SHORT[s.m]||s.m)}</span><div class="bar sm"><i style="width:${pc(smade(s))}%"></i></div><span>${smade(s)}/${it.qty}</span></div>`).join('')}
      <div class="stg">${dn?'✅ Готово':GR[c.g]+' → '+c.n}</div>
    </div></div></div>`;
  if(x){
    if(it.img)h+=`<img src="${it.img}" data-a="zoom" alt="" style="width:100%;max-height:300px;object-fit:contain;margin-top:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);cursor:zoom-in">`;

    if(it.steps&&it.steps.mach&&it.steps.mach.on){

      if(!ss.length)h+='<div class="mu">Сетапов пока нет</div>';

      if(ft)h+='<div class="row"><input class="rq" type="number" min="0" inputmode="numeric" placeholder="Готово, шт"><input class="rb" type="number" min="0" inputmode="numeric" placeholder="Брак"></div><input class="rn" placeholder="Комментарий" style="margin-top:6px"><button data-a="rep" style="margin-top:6px">Отправить отчёт</button>';
      h+=(it.reports||[]).slice().reverse().slice(0,8).map(r=>`<div class="rp"><span class="mu">${when(r.t)} · ${esc(r.by)}</span><br>Готово: <b>${r.q||0}</b>${r.b?', брак: <b>'+r.b+'</b>':''}${r.n?' · '+esc(r.n):''}</div>`).join('');

const by=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(a.cr||0)-(b.cr||0);
function render(){
  const v=visible();$('cnt').textContent=v.length+' из '+items.length+' позиций';let h='';
  if($('fv').value==='proj'){
    const m={};v.forEach(i=>{const k=projs.some(p=>p.id===i.proj)?i.proj:'_';(m[k]=m[k]||[]).push(i)});
    const rank=a=>Math.min(...a.map(i=>i.urg==='urgent'?0:i.urg==='low'?2:1));
    projs.filter(p=>m[p.id]).sort((a,b)=>rank(m[a.id])-rank(m[b.id])||by(m[a.id].slice().sort(by)[0],m[b.id].slice().sort(by)[0])).forEach(p=>{
      const all=items.filter(i=>i.proj===p.id),dn=all.filter(i=>!cur(i)).length,tot=all.reduce((n,i)=>n+(+i.qty||0),0),rd=all.reduce((n,i)=>n+prog(i),0);
      h+=`<div class="card" data-pid="${p.id}"><div class="hd" data-a="ptog"><div class="row bt"><b>📁 ${esc(p.name)}</b><span class="mu">деталей готово: ${dn} из ${all.length}</span></div><div class="bar"><i style="width:${tot?Math.min(100,Math.round(rd/tot*100)):0}%"></i></div><div class="mu">Изготовлено ${rd} из ${tot} шт</div></div>`;
      if(openP.has(p.id)){h+=m[p.id].slice().sort(by).map(i=>card(i,true)).join('');if(me.role==='admin')h+='<div style="margin-top:10px"><button class="g" data-a="pdel" style="color:var(--rd)">Удалить проект (детали останутся)</button></div>'}
      h+='</div>'});
    if(m._)h+='<div class="gh">Без проекта</div>'+m._.slice().sort(by).map(i=>card(i,false)).join('');
  }else{
    h=URG.map(([k,n])=>{const g=v.filter(i=>(i.urg||'normal')===k).sort(by);return g.length?`<div class="gh">${n} (${g.length})</div>`+g.map(i=>card(i,false)).join(''):''}).join('');
  }
  $('list').innerHTML=h||'<div class="mu" style="text-align:center;padding:24px">Нет позиций</div>';
}

async function uploadFile(f,item,kind){
  if(f.size>8*1048576)throw new Error('Файл больше 8 МБ: '+f.name);
  const buf=new Uint8Array(await f.arrayBuffer()),CH=650*1024,n=Math.max(1,Math.ceil(buf.length/CH)),fid=uid();
  for(let i=0;i<n;i++){
    const part=buf.subarray(i*CH,(i+1)*CH);let bin='';
    for(let j=0;j<part.length;j+=8192)bin+=String.fromCharCode.apply(null,part.subarray(j,j+8192));
    await col('files').doc(fid+'_'+i).set({fid,item,kind,i,n,data:btoa(bin)});
  }
  return {fid,name:f.name,size:f.size,type:f.type||'',n,t:Date.now()};
}
async function delChunks(m){for(let i=0;i<m.n;i++)await col('files').doc(m.fid+'_'+i).delete()}
async function download(m){
  const ps=await Promise.all(Array.from({length:m.n},(_,i)=>col('files').doc(m.fid+'_'+i).get()));
  const arr=ps.map(d=>Uint8Array.from(atob(d.data().data),c=>c.charCodeAt(0)));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(arr,{type:m.type||'application/octet-stream'}));a.download=m.name;document.body.appendChild(a);a.click();a.remove();
}

$('list').addEventListener('click',async e=>{
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  try{
    if(a==='ptog'||a==='pdel'){const pid=t.closest('.card').dataset.pid;
      if(a==='ptog'){openP.has(pid)?openP.delete(pid):openP.add(pid);render()}
      else if(confirm('Удалить проект? Детали останутся без проекта.')){for(const i of items.filter(i=>i.proj===pid))await col('plan').doc(i.id).update({proj:''});await col('projects').doc(pid).delete()}
      return}
    const c=t.closest('.card'),id=c.dataset.id,it=items.find(i=>i.id===id);if(!it)return;
    if(a==='tog'){open.has(id)?open.delete(id):open.add(id);render();return}
    if(a==='zoom'){$('zm').querySelector('img').src=it.img;$('zm').style.display='flex';return}
    if(a==='edit'){openEd(it);return}
    if(a==='del'){if(confirm('Удалить позицию «'+it.title+'» вместе с файлами?')){
      for(const m of it.files||[])await delChunks(m);for(const m of (privs[id]||{}).docs||[])await delChunks(m);
      await col('plan_private').doc(id).delete();await col('plan').doc(id).delete()}return}
    if(a==='dl'||a==='fdel'){
      const priv=t.dataset.k==='priv',m=((priv?(privs[id]||{}).docs:it.files)||[]).find(f=>f.fid===t.dataset.fid);if(!m)return;
      if(a==='dl'){t.textContent='⏳ '+m.name;await download(m);t.textContent='📎 '+m.name;return}
      if(confirm('Удалить файл «'+m.name+'»?')){await delChunks(m);
        if(priv)await col('plan_private').doc(id).update({docs:FV().arrayRemove(m)});else await col('plan').doc(id).update({files:FV().arrayRemove(m)})}
      return}
    if(a==='sadd'){
      const n=Math.max(0,...sset(it).map(s=>s.n||0))+1;
      await col('plan').doc(id).update({['setups.s'+uid()]:{n,m:c.querySelector('.nm').value,tm:'',by:me.name,cr:Date.now(),reports:[]},upd:Date.now()});return}
    if(a==='srep'){
      const su=t.closest('.su'),sid=su.dataset.sid,q=parseInt(su.querySelector('.sq').value,10)||0,b=parseInt(su.querySelector('.sb2').value,10)||0;
      if(!q&&!b){flash(su.querySelector('.sq'));return}
      const r={t:Date.now(),by:me.name,q,b,n:su.querySelector('.sn').value.trim()};
      const sim=sset(it).map(s=>s.id===sid?smade(s)+q:smade(s)),upd={['setups.'+sid+'.reports']:FV().arrayUnion(r),upd:Date.now()};
      if(Math.min(...sim)>=it.qty&&it.steps&&it.steps.mach&&it.steps.mach.on&&!it.steps.mach.done){upd['steps.mach.done']=true;upd['steps.mach.t']=Date.now();upd['steps.mach.by']=me.name}
      await col('plan').doc(id).update(upd);dirty=false;return}
    if(a==='rep'){
      const q=parseInt(c.querySelector('.rq').value,10)||0,b=parseInt(c.querySelector('.rb').value,10)||0;
      if(!q&&!b){flash(c.querySelector('.rq'));return}
      await col('plan').doc(id).update({reports:FV().arrayUnion({t:Date.now(),by:me.name,r:me.role,q,b,n:c.querySelector('.rn').value.trim()}),upd:Date.now()});dirty=false}
  }catch(err){alert('Не удалось выполнить: '+(err.message||err.code))}
});

function stepBoxes(on){$('est').innerHTML=[1,2,3].map(g=>`<div class="gt">${GT[g]}</div>`+STEPS.filter(s=>s.g===g).map(s=>`<label style="display:flex;gap:8px;align-items:center;margin:4px 0;font-size:15px"><input type="checkbox" id="es_${s.k}" style="width:20px;height:20px" ${on[s.k]?'checked':''}> ${s.n}</label>`).join('')).join('')}
function openEd(it){
  editing=it||null;$('edt').textContent=it?'Изменить позицию':'Новая позиция';$('ems').textContent='';
  $('et').value=it?it.title:'';$('ea').value=it?it.art||'':'';$('ety').value=it?it.type:'own';$('eq').value=it?it.qty:'';$('ec').value=it?it.client||'':'';
  $('em').value=it?it.material||'':'';$('eu').value=it?it.urg||'normal':'normal';$('ed').value=it?it.due||'':'';$('en').value=it?it.notes||'':'';
  $('ef').value='';$('efp').value='';$('efv').value='';$('epn').value='';$('epn').style.display='none';
  $('einf').value=it?(privs[it.id]||{}).info||'':'';
  $('epj').innerHTML='<option value="">— без проекта —</option>'+projs.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru')).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')+'<option value="__new">＋ Новый проект…</option>';
  $('epj').value=it&&projs.some(p=>p.id===it.proj)?it.proj:'';
  const on={};STEPS.forEach(s=>on[s.k]=it?!!(it.steps&&it.steps[s.k]&&it.steps[s.k].on):defOn('own',s.k));
  stepBoxes(on);$('ecw').style.display=$('ety').value==='ext'?'':'none';$('edm').style.display='flex';
}

$('esv').onclick=async()=>{
  const title=$('et').value.trim(),qty=parseInt($('eq').value,10);
  if(!title||!qty||qty<1){if(!title)flash($('et'));if(!qty||qty<1)flash($('eq'));return}
  $('esv').disabled=true;$('ems').textContent='Сохраняю…';
  try{
    const id=editing?editing.id:uid();let proj=$('epj').value;
    if(proj==='__new'){const nm=$('epn').value.trim();if(!nm){flash($('epn'));throw new Error('Введите название проекта')}proj=uid()+'p';await col('projects').doc(proj).set({name:nm,cr:Date.now()})}
    const old=editing&&editing.steps||{},steps={};
    STEPS.forEach(s=>{const on=$('es_'+s.k).checked,o=old[s.k]||{};steps[s.k]={on,done:on&&!!o.done,t:o.t||0,by:o.by||''}});
    const d={title,art:$('ea').value.trim(),type:$('ety').value,client:$('ec').value.trim(),qty,material:$('em').value.trim(),urg:$('eu').value,due:$('ed').value,notes:$('en').value.trim(),proj:proj||'',steps,upd:Date.now()};
    const f=$('ef').files[0];if(f)d.img=shrink(await fileToCanvas(f));
    if(editing)await col('plan').doc(id).update(d);
    else{d.cr=Date.now();d.reports=[];d.setups={};d.files=[];d.img=d.img||'';await col('plan').doc(id).set(d)}
    const pf=[...$('efp').files],vf=[...$('efv').files],tot=pf.length+vf.length,pm=[],vm=[];let k=0;
    for(const x of pf){$('ems').textContent='Загружаю файл '+(++k)+' из '+tot+'…';pm.push(await uploadFile(x,id,'public'))}
    for(const x of vf){$('ems').textContent='Загружаю файл '+(++k)+' из '+tot+'…';vm.push(await uploadFile(x,id,'admin'))}
    if(pm.length)await col('plan').doc(id).update({files:FV().arrayUnion(...pm)});
    const pv={info:$('einf').value.trim()};if(vm.length)pv.docs=FV().arrayUnion(...vm);
    await col('plan_private').doc(id).set(pv,{merge:true});
    $('edm').style.display='none';
  }catch(err){$('ems').textContent='Ошибка: '+(err.message||err.code)}
  finally{$('esv').disabled=false}
};

(function(){
  const s=$('q'),vv=window.visualViewport,vh=()=>vv?vv.height:window.innerHeight;
  let base=Math.max(window.innerHeight,vh()),shown=false;
  const lift=()=>setTimeout(()=>{if(document.activeElement===s)s.scrollIntoView({block:'start',behavior:'smooth'})},200);
  s.addEventListener('focus',()=>{document.body.style.paddingBottom='60vh';lift()});
  s.addEventListener('blur',()=>{shown=false;document.body.style.paddingBottom='';window.scrollTo({top:0,behavior:'smooth'})});
  (vv||window).addEventListener('resize',()=>{const h=vh();if(h>base)base=h;if(document.activeElement!==s)return;
    if(h<base*0.8){shown=true;lift()}else if(shown&&h>base*0.85)s.blur()});
})();
